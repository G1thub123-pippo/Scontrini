// ── PC858 encoding ────────────────────────────────────────────────
function pc858(s){
  const M={'é':0x82,'è':0x8A,'à':0x85,'ì':0x8D,'ù':0x97,'ò':0x95,
           'ê':0x88,'É':0x90,'È':0xD4,'À':0xB7,'ç':0x87,'ü':0x81};
  return Array.from(s).map(c=>c.charCodeAt(0)<0x80?c.charCodeAt(0):(M[c]||0x3F));
}

// ── ESC/POS receipt builder ───────────────────────────────────────
// Intestazione spezzata su righe corte così ESC a 1 (centrato) funziona.
// Riga 32 byte = 32 char su carta 58 mm (384 dot / 12 dot per char).
// € inviato come 0xD5 in PC858 — niente UTF-8, niente a capo inattesi.
function buildReceipt(items,totale,data,ora){
  const buf=[];
  const B=(...bs)=>bs.forEach(b=>buf.push(b));
  const T=s=>pc858(s).forEach(b=>buf.push(b));
  const NL=()=>buf.push(0x0A);
  const SEP=(c='-')=>{for(let i=0;i<32;i++)buf.push(c.charCodeAt(0));NL();};

  B(0x1B,0x40);       // ESC @ init
  B(0x1B,0x74,0x13);  // ESC t 19 — PC858
  B(0x1B,0x61,0x00);  // sempre sinistra: centramento manuale con spazi
  NL();

  // ctr(): centra manualmente una stringa su 32 col aggiungendo spazi
  const ctr=(s)=>{const b=pc858(s);const p=Math.floor((32-b.length)/2);for(let i=0;i<p;i++)buf.push(0x20);b.forEach(x=>buf.push(x));NL();};

  // ─ Intestazione da headerLines (modificabile dall'app) ─────────
  B(0x1B,0x45,0x01);
  ctr(headerLines[0]||'');
  B(0x1B,0x45,0x00);
  for(let hi=1;hi<headerLines.length;hi++) ctr(headerLines[hi]||'');
  SEP('=');
  B(0x1B,0x21,0x10);   // doppia altezza
  B(0x1B,0x45,0x01);
  // Solo testo — la stampante non supporta emoji
  ctr(nomeEvento||'');
  B(0x1B,0x21,0x00);
  B(0x1B,0x45,0x00);
  SEP('=');

  // ─ Data / ora ────────────────────────────────────────────────
  const dSp=32-data.length-ora.length;
  T(data); for(let i=0;i<dSp;i++)buf.push(0x20); T(ora); NL();
  const numStr='N. '+numScontrino;
  const nSp=32-numStr.length;
  for(let i=0;i<nSp;i++)buf.push(0x20); T(numStr); NL();
  SEP('-');

  // ─ Voci: nome(10) + unitario(6) + qty(4) + subtotale(12) = 32 ─
  // Se c'è nome2: prezzo allineato all'ultima riga (nome2)
  // Se non c'è nome2: prezzo sulla stessa riga di nome1
  items.forEach(it=>{
    const up=it.prezzo.toFixed(2);
    const q=`x${it.qty}`;
    const s=it.sub.toFixed(2);
    const hasNome2=it.nome2&&it.nome2.trim();

    function stampaPrezzi(){
      // unit: 7 byte (es. " € 3.00" o "€ 10.00")
      for(let i=0;i<Math.max(0,7-2-up.length);i++)buf.push(0x20);
      buf.push(0xD5); buf.push(0x20); T(up);
      // qty: 4 byte
      for(let i=q.length;i<4;i++)buf.push(0x20);
      T(q);
      // sub: 11 byte (es. "    € 3.00")
      for(let i=0;i<Math.max(0,11-2-s.length);i++)buf.push(0x20);
      buf.push(0xD5); buf.push(0x20); T(s);
    }

    if(hasNome2){
      // Riga 1: solo nome1 (senza prezzo)
      const n=pc858((it.nome||'').substring(0,10));
      n.forEach(b=>buf.push(b));
      NL();
      // Riga 2: nome2 + prezzo
      const n2=pc858(it.nome2.trim().substring(0,10));
      n2.forEach(b=>buf.push(b));
      for(let i=n2.length;i<10;i++)buf.push(0x20);
      stampaPrezzi();
      NL();
    } else {
      // Riga unica: nome1 + prezzo
      const n=pc858((it.nome||'').substring(0,10));
      n.forEach(b=>buf.push(b));
      for(let i=n.length;i<10;i++)buf.push(0x20);
      stampaPrezzi();
      NL();
    }
    // ESC J 8 — spazio ~1mm dopo ogni voce completa
    B(0x1B,0x4A,0x0C);
  });

  SEP('-');

  // ─ Totale grassetto ──────────────────────────────────────────
  B(0x1B,0x21,0x10);   // doppia altezza
  B(0x1B,0x45,0x01);   // grassetto
  T('TOTALE');
  const ts=totale.toFixed(2);
  for(let i=0;i<32-6-2-ts.length;i++)buf.push(0x20);
  buf.push(0xD5); buf.push(0x20); T(ts); NL();
  B(0x1B,0x45,0x00);
  B(0x1B,0x21,0x00);   // normale
  SEP('=');
  // Messaggio di ringraziamento
  if(msgRingraziamento&&msgRingraziamento.length>0){
    NL();
    msgRingraziamento.forEach(riga=>{ if(riga.trim()) ctr(riga.trim().substring(0,32)); });
    NL();
  }

  // ─ Scontrino non Fiscale centrato ────────────────────────────
  ctr('Scontrino non Fiscale');        // pad=(32-21)/2=5
  SEP('=');

  NL();NL();NL();
  B(0x1D,0x56,0x00); // taglia carta
  return new Uint8Array(buf);
}

async function sendBLE(data){
  const CHUNK=20;
  for(let i=0;i<data.length;i+=CHUNK){
    try{await bleChr.writeValueWithoutResponse(data.slice(i,i+CHUNK));}
    catch{await bleChr.writeValue(data.slice(i,i+CHUNK));}
    await new Promise(r=>setTimeout(r,20));
  }
}

  a.download='scontrini_config.json';

  URL.revokeObjectURL(url);
}
function importaConfig(ev){
  const file=ev.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{

async function toggleConn(){
  if(connSt==='on'){if(bleDev)bleDev.gatt.disconnect();bleDev=null;bleChr=null;setConn('off');return;}
  if(!navigator.bluetooth){showModal({tipo:'ok',testo:'Usa Chrome su Android.'});return;}
  try{
    setConn('loading');
    bleDev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[BLE_SVC]});
    const srv=await bleDev.gatt.connect();
    const svc=await srv.getPrimaryService(BLE_SVC);
    try{bleChr=await svc.getCharacteristic(BLE_CHRA);}
    catch{bleChr=await svc.getCharacteristic(BLE_CHRB);}
    setConn('on');
    bleDev.addEventListener('gattserverdisconnected',()=>{bleDev=null;bleChr=null;setConn('off');});
  }catch(e){
    setConn('off');
    if(e.name!=='NotFoundError')showModal({tipo:'ok',testo:`Errore: ${e.message}`});
  }
}
function setConn(s){
  connSt=s;
  const M={off:['#555','Stampante non connessa','Connetti','#c47c00'],
           loading:['#f0a800','Connessione...','...','#555'],
           on:['#4caf50','Stampante connessa','Disconnetti','#2a2a3e'],
           err:['#f44','Errore','Riprova','#c47c00']};
  const [col,lab,blab,bbg]=M[s];
  document.getElementById('connDot').style.background=col;
  document.getElementById('connLabel').textContent=lab;
  const btn=document.getElementById('connBtn');
  btn.textContent=blab;btn.style.background=bbg;btn.disabled=(s==='loading');
}

async function vendiEStampa(){
  const tot=totO();if(tot===0)return;
  const now=new Date();
  const data=now.toLocaleDateString('it-IT');
  const ora=now.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  const items=MENU.filter(i=>qty[i.id]>0).map(i=>({
    nome:i.nome,nome2:i.nome2||'',emoji:i.emoji,qty:qty[i.id],sub:i.prezzo*qty[i.id],prezzo:i.prezzo
  }));
  numScontrino++;
  localStorage.setItem('numScontrino',numScontrino);
  ultimoScontrino={data,ora,items,totale:tot,num:numScontrino};
  localStorage.setItem('ultimoScontrino',JSON.stringify(ultimoScontrino));
  showModal({tipo:'scontrino',data,ora,items,totale:tot,num:numScontrino});
  if(bleChr){
    try{await sendBLE(buildReceipt(items,tot,data,ora));}
    catch{bleDev=null;bleChr=null;setConn('err');}
  }
  MENU.forEach(i=>{sold[i.id]=(sold[i.id]||0)+(qty[i.id]||0);qty[i.id]=0;});
  save();render();
}

async function esporta(){
  let text=await leggiOPFS();
  if(!text) text=JSON.stringify({venduti:sold,savedAt:new Date().toISOString()},null,2);
  const blob=new Blob([text],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='vendite_'+new Date().toLocaleDateString('it-IT').replace(/\//g,'-')+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importa(ev){
  const file=ev.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.venduti){sold=d.venduti;save();render();showModal({tipo:'ok',testo:'Dati ripristinati!'});}
      else showModal({tipo:'ok',testo:'File non valido.'});
    }catch{showModal({tipo:'ok',testo:'Errore lettura file.'});}
  };
  r.readAsText(file);
  ev.target.value='';
}
async function ristampa(){
  if(!ultimoScontrino){showModal({tipo:'ok',testo:'Nessuno scontrino da ristampare.'});return;}
  const {data,ora,items,totale}=ultimoScontrino;
  showModal({tipo:'scontrino',data,ora,items,totale,num:ultimoScontrino.num});
  if(bleChr){
    try{await sendBLE(buildReceipt(items,totale,data,ora));}
    catch{bleDev=null;bleChr=null;setConn('err');}
  }
}
function applicaStorno(){
  if(!MENU.some(i=>sto[i.id]>0))return;
  MENU.forEach(i=>{sold[i.id]=Math.max(0,(sold[i.id]||0)-(sto[i.id]||0));sto[i.id]=0;});

      const p=(document.getElementById('evPrezzo')?.value||'0.00');
      const pr=parseFloat(p)||0;
      const line=n+' €'+pr.toFixed(2).padStart(5)+' x1 '+('€'+pr.toFixed(2)).padStart(9);
      const n2=(document.getElementById('evNome2')?.value||'').trim();
      document.getElementById('prevLine').textContent=line+(n2?'\n'+n2:'');
    }
    setTimeout(()=>{
      document.getElementById('evNome')?.addEventListener('input',aggiornaPrev);
      document.getElementById('evNome2')?.addEventListener('input',aggiornaPrev);
      document.getElementById('evPrezzo')?.addEventListener('input',aggiornaPrev);
      aggiornaPrev();
      document.getElementById('evNome')?.focus();
    },100);
  } else {
    box.innerHTML=`
      <div style="color:#fff;font-size:15px;text-align:center;white-space:pre-line;margin-bottom:20px">${m.testo}</div>
      <button class="btn am" onclick="closeModal()">OK</button>`;
  }
}
function closeModal(){document.getElementById('overlay').style.display='none';}
function closeModalOnBg(e){if(e.target===document.getElementById('overlay'))closeModal();}

function go(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('t-'+t).classList.add('active');
  render();
}
function render(){
  const c=document.getElementById('ct');
  if(tab==='ordine')  c.innerHTML=rOrdine();
  if(tab==='vendite') c.innerHTML=rVendite();
  if(tab==='storno')  c.innerHTML=rStorno();
}
function rOrdine(){
  const tot=totO();
  const rows=MENU.filter(i=>i.attivo).map(i=>{
    const q=qty[i.id]||0,s=i.prezzo*q;
    return `<div class="card ${q?'hi-amber':''}">
      <div class="info"><div class="iname">${i.emoji} ${i.nome}${i.nome2?' '+i.nome2:''}</div>
      <div class="iprice">\u20ac ${i.prezzo.toFixed(2)}</div></div>
      <div class="step">
        <button class="bs ${q?'am':''}" onclick="setQ(${i.id},${q-1})">&#8722;</button>
        <input class="q" type="number" min="0" value="${q}" oninput="setQ(${i.id},this.value)">
        <button class="bs am" onclick="setQ(${i.id},${q+1})">+</button>
      </div>
      <div class="sub ${q?'hi':''}">\u20ac ${s.toFixed(2)}</div>
    </div>`;
  }).join('');
  const dot=connSt==='on'?' &#128992;':'';
  return `<div class="lbl">ORDINE CORRENTE</div>${rows}
    <div class="tbox"><span class="tlbl">TOTALE</span><span class="tamt">${eur(tot)}</span></div>
    <button class="btn ${tot?'am':'dim'}" onclick="vendiEStampa()">&#128424;&#65039; VENDI &amp; STAMPA${dot}</button>
    <button class="btn" style="background:#1e1e30;color:#888;border:1px solid #2a2a3e;font-size:14px" onclick="ristampa()">&#128260; Ristampa ultimo scontrino</button>`;
}
function rVendite(){
  const tot=totV();
  const rows=MENU.map(i=>{
    const q=sold[i.id]||0,s=i.prezzo*q;
    return `<div class="vrow">
      <div><div class="iname">${i.emoji} ${i.nome}${i.nome2?' '+i.nome2:''}</div>
      <div class="isold">\u20ac ${i.prezzo.toFixed(2)} \u00d7 ${q} pz</div></div>
      <div class="vamt ${q?'hi':''}">\u20ac ${s.toFixed(2)}</div>
    </div>`;
  }).join('');
  const saveInfo=lastSave
    ?`<div style="color:#4caf50;font-size:12px;margin-bottom:12px">&#128190; Salvato alle ${lastSave} — dati al sicuro</div>`
    :`<div style="color:#888;font-size:12px;margin-bottom:12px">&#128190; Nessuna vendita ancora registrata</div>`;
  return `<div class="lbl">TOTALE VOCI VENDUTE</div>${saveInfo}${rows}
    <div class="tbox"><span class="tlbl">INCASSO TOTALE</span><span class="tamt">${eur(tot)}</span></div>
    <button class="btn am" onclick="condividi()" style="margin-bottom:10px">&#128228; Condividi riepilogo</button>
    <div style="display:flex;gap:10px;margin-bottom:10px">
      <button class="btn" style="background:#1e4d2b;color:#4caf50;border:2px solid #2d7a45;flex:1" onclick="esporta()">&#128229; Esporta</button>
      <label style="flex:1;display:flex">
        <input type="file" accept=".json" style="display:none" onchange="importa(event)">
        <span class="btn" style="background:#1a2e4a;color:#5b9bd5;border:2px solid #2a5080;width:100%;text-align:center;cursor:pointer">&#128228; Importa</span>
      </label>
    </div>
    <button class="btn out" onclick="azzeraTotali()">&#128465;&#65039; Azzera tutti i totali</button>`;
}
function rStorno(){
  const rows=MENU.map(i=>{
    const q=sto[i.id]||0,mx=sold[i.id]||0;
    return `<div class="card ${q?'hi-red':''}">
      <div class="info"><div class="iname">${i.emoji} ${i.nome}${i.nome2?' '+i.nome2:''}</div>
      <div class="isold">Venduti: ${mx} pz</div></div>
      <div class="step">
        <button class="bs ${q?'rd':''}" onclick="setS(${i.id},${q-1})">&#8722;</button>
        <input class="q" type="number" min="0" max="${mx}" value="${q}" oninput="setS(${i.id},this.value)">
        <button class="bs rd" onclick="setS(${i.id},Math.min(${mx},(sto[${i.id}]||0)+1))">+</button>
      </div>
      <div class="sub ${q?'rd':''}">\u2212\u20ac ${(i.prezzo*q).toFixed(2)}</div>
    </div>`;
  }).join('');
  const has=MENU.some(i=>sto[i.id]>0);
  return `<div class="lbl">STORNO</div>
    <div class="note">Seleziona le quantit\u00e0 da annullare</div>${rows}
    <button class="btn ${has?'rd':'rdim'}" onclick="applicaStorno()">&#8617;&#65039; APPLICA STORNO</button>`;
}

document.getElementById('nomeEventoLabel').textContent=nomeEvento;
document.getElementById('eventoEmojiLabel').textContent=eventoEmoji;
document.getElementById('appbarSub').textContent=headerLines[0]||'';
document.getElementById('versionLabel').textContent=APP_VERSION;
// ── Firebase bridge ──────────────────────────────────────────────
window._getStato=()=>({
  venduti:sold, numScontrino, menu:MENU,
  headerLines, nomeEvento, eventoEmoji, msgRingraziamento
});

window.applicaDati=(d)=>{
  let needRender=false;
  const j=JSON.stringify;
  if(d.venduti&&j(d.venduti)!==j(sold)){sold=d.venduti;localStorage.setItem('venduti',j(sold));needRender=true;}
  if(d.numScontrino!==undefined&&d.numScontrino!==numScontrino){numScontrino=d.numScontrino;localStorage.setItem('numScontrino',String(numScontrino));}
  if(d.menu&&j(d.menu)!==j(MENU)){MENU=d.menu;localStorage.setItem('menu',j(MENU));needRender=true;}
  if(d.headerLines&&j(d.headerLines)!==j(headerLines)){headerLines=d.headerLines;localStorage.setItem('headerLines',j(headerLines));needRender=true;}
  if(d.nomeEvento&&d.nomeEvento!==nomeEvento){nomeEvento=d.nomeEvento;localStorage.setItem('nomeEvento',nomeEvento);needRender=true;}
  if(d.eventoEmoji&&d.eventoEmoji!==eventoEmoji){eventoEmoji=d.eventoEmoji;localStorage.setItem('eventoEmoji',eventoEmoji);needRender=true;}
  if(d.msgRingraziamento&&j(d.msgRingraziamento)!==j(msgRingraziamento)){msgRingraziamento=d.msgRingraziamento;localStorage.setItem('msgRingraziamento',j(msgRingraziamento));needRender=true;}
  if(needRender){
    document.getElementById('nomeEventoLabel').textContent=nomeEvento;
    document.getElementById('eventoEmojiLabel').textContent=eventoEmoji;
    document.getElementById('appbarSub').textContent=headerLines[0]||'';
    render();
  }
};

window.setSyncStatus=(s)=>{
  const el=document.getElementById('syncDot');
  if(!el)return;
  const M={ok:['#4caf50','Sincronizzato'],saving:['#f0a800','Salvataggio...'],err:['#f66','Offline']};
  el.style.background=M[s][0];
  el.title=M[s][1];
};

window._fbPronto=(fn)=>{
  _fbSalva=fn;
  if(_fbCoda){_fbSalva(window._getStato());_fbCoda=null;}
};

let _fbTimer=null;
function syncFirebase(){
  clearTimeout(_fbTimer);
  _fbTimer=setTimeout(()=>{
    const stato=window._getStato();
    if(_fbSalva){_fbSalva(stato);}else{_fbCoda=stato;}
  },600);
}

render();setConn('off');
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBLJEFpfkMFB8ShQopgCkAshE3qCDkXmw8",
  authDomain:"scontrini-pwa.firebaseapp.com",
  projectId:"scontrini-pwa",
  storageBucket:"scontrini-pwa.firebasestorage.app",
  messagingSenderId:"538517498464",
  appId:"1:538517498464:web:2adf8dba9b8d72e8ecb105"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const DOC=doc(db,'scontrini-pwa','dati');
let _mioUltimoTs='';
let _primoSnap=true;

const fbSalva=async(dati)=>{
  const ts=new Date().toISOString();
  _mioUltimoTs=ts; // impostato PRIMA di setDoc per evitare echo
  try{
    window.setSyncStatus('saving');
    await setDoc(DOC,{...dati,aggiornatoIl:ts});
    localStorage.setItem('sc_lastSave',ts);
    window.setSyncStatus('ok');
  }catch(e){
    _mioUltimoTs=''; // reset in caso di errore
    window.setSyncStatus('err');
  }
};

onSnapshot(DOC,snap=>{
  if(!snap.exists()){
    fbSalva(window._getStato());
    _primoSnap=false;
    return;
  }
  const d=snap.data();
  const remoto=d.aggiornatoIl||'';
  if(_primoSnap){
    _primoSnap=false;
    const localeTs=localStorage.getItem('sc_lastSave')||'';
    if(remoto>=localeTs){
      _mioUltimoTs=remoto;
      localStorage.setItem('sc_lastSave',remoto);
      window.applicaDati(d);
      window.setSyncStatus('ok');
    }else{
      fbSalva(window._getStato());
    }
    return;
  }
  if(remoto!==_mioUltimoTs){
    _mioUltimoTs=remoto;
    window.applicaDati(d);
    window.setSyncStatus('ok');
  }
},()=>window.setSyncStatus('err'));

window._fbPronto(fbSalva);
</script>
